name: Build

# Builds the Flatpak and the AppImage.
#  - every push / pull request: downloadable artifacts on the run page
#  - weekly + manual: picks up the latest upstream SmartTwitchTV web app
#  - tag v*: publishes both files as a GitHub Release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: SmartTwitchTV.flatpak
          manifest-path: packaging/flatpak/io.github.smarttwitchtv.Desktop.yml
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/*.yml') }}
          upload-artifact: true

  appimage:
    name: AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build AppImage
        run: ./scripts/build-appimage.sh SmartTwitchTV-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: SmartTwitchTV-x86_64.AppImage
          path: SmartTwitchTV-x86_64.AppImage
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [flatpak, appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect files
        run: |
          mkdir out
          find artifacts -name '*.flatpak' -exec cp {} out/SmartTwitchTV.flatpak \;
          find artifacts -name '*.AppImage' -exec cp {} out/ \;
          ls -la out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
